[project]
name = "genew4-orm"
version = "0.1.0"
description = "Python ORM for the genew4 PostgreSQL database with type-safe models, audit logging, and session management."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Gene Nomenclature Team", email = "dev@genomenclature.org"}
]
keywords = [
    "sqlalchemy",
    "orm",
    "postgresql",
    "genew4",
    "hgnc",
    "gene",
    "database",
    "pydantic",
    "type-safety",
    "audit",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "db-common>=0.1.0",
    "alembic>=1.15.0",
    "psycopg>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.46",
]

[tool.uv.sources]
# Pinned to an immutable tag on HGNC/db-common (never a moving branch).
db-common = { git = "https://github.com/HGNC/db-common.git", tag = "v0.1.0" }

[project.urls]
Homepage = "https://github.com/HGNC/genew4-orm"
Documentation = "https://hgnc.github.io/genew4-orm"
Repository = "https://github.com/HGNC/genew4-orm.git"
"Bug Tracker" = "https://github.com/HGNC/genew4-orm/issues"

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--cov=genew4_orm",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["src/genew4_orm"]
omit = [
    "tests/*",
    "*/test_*.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]
# Docs builders for mkdocs (used by .github/workflows/docs.yml). Resolved via uv
# so the git-only `db-common` dependency ([tool.uv.sources]) is honored.
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".eggs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "YTT"]
ignore = []

[tool.black]
line-length = 120
target-version = ["py313"]
skip-string-normalization = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = ["pydantic", "sqlalchemy"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
strict = true
# db-common ships no py.typed marker, so under ``strict = true`` every
# ``class X(db_common.DeclarativeBase)`` / ``(db_common.EngineFactory)`` would
# trip ``disallow_subclassing_any`` (the ``[misc]`` "subclass ... (Any)" errors).
# Relax it to match the non-strict sibling ensembl-orm's posture: db-common is
# consumed as ``Any`` (see the db_common override below) and subclassing it is
# allowed. ``warn_return_any`` stays on so genuinely-Any returns are still
# surfaced and must be resolved at the call site.
disallow_subclassing_any = false
exclude = [
    "venv/*",
    ".venv/*",
    "build/*",
]

[[tool.mypy.overrides]]
# db-common is intentionally consumed untyped (no py.typed in its repo at the
# pinned v0.1.0 tag). This silences the ``[import-untyped]`` errors; combined
# with ``disallow_subclassing_any = false`` above it also clears the ``[misc]``
# subclass errors that ``ignore_missing_imports`` alone does not.
module = "db_common.*"
ignore_missing_imports = true
