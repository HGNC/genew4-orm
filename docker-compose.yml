version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genew4_test
      POSTGRES_PASSWORD: genew4_test_password
      POSTGRES_DB: genew4_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genew4_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    options: >-
      --health-cmd pg_isready
      --interval 10s
      --timeout 5s
      --health-start-period 10s
      --retries 5

volumes:
  postgres_data:
