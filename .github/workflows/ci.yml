name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genew4
          POSTGRES_PASSWORD: genew4_test_password
          POSTGRES_DB: genew4
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 10s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=genew4_orm --cov-report=xml --cov-report=term-missing

      - name: Run database migrations
        env:
          DATABASESETTINGS_PG_HOST: localhost
          DATABASESETTINGS_PG_PORT: 5432
          DATABASESETTINGS_PG_NAME: genew4
          DATABASESETTINGS_PG_USER: genew4
          DATABASESETTINGS_PG_PASSWORD: genew4_test_password
        run: uv run alembic upgrade head

      - name: Run integration tests
        env:
          DATABASESETTINGS_PG_HOST: localhost
          DATABASESETTINGS_PG_PORT: 5432
          DATABASESETTINGS_PG_NAME: genew4
          DATABASESETTINGS_PG_USER: genew4
          DATABASESETTINGS_PG_PASSWORD: genew4_test_password
        run: uv run pytest tests/integration/ -v --cov=genew4_orm --cov-report=xml --cov-append --cov-report=term-missing

      - name: Run e2e tests
        env:
          DATABASESETTINGS_PG_HOST: localhost
          DATABASESETTINGS_PG_PORT: 5432
          DATABASESETTINGS_PG_NAME: genew4
          DATABASESETTINGS_PG_USER: genew4
          DATABASESETTINGS_PG_PASSWORD: genew4_test_password
        run: uv run pytest tests/e2e/ -v --cov=genew4_orm --cov-append --cov-report=xml

      - name: Generate coverage report
        run: uv run pytest --cov=genew4_orm --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
