name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=genew4_orm --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --cov=genew4_orm --cov-report=xml --cov-append --cov-report=term-missing

      - name: Run e2e tests
        run: uv run pytest tests/e2e/ -v --cov=genew4_orm --cov-append --cov-report=xml

      - name: Generate coverage report
        run: uv run pytest --cov=genew4_orm --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
