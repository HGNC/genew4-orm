name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Database settings for testing (using Docker PostgreSQL)
  # Note: Pydantic uses double underscore: DATABASESETTINGS__PG_HOST
  DATABASESETTINGS__PG_HOST: localhost
  DATABASESETTINGS__PG_PORT: 5432
  DATABASESETTINGS__PG_NAME: genew4_test
  DATABASESETTINGS__PG_USER: genew4_test
  DATABASESETTINGS__PG_PASSWORD: genew4_test_password

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genew4_test
          POSTGRES_PASSWORD: genew4_test_password
          POSTGRES_DB: genew4_test
        options: >-
          --health-cmd pg_isready
          --interval 10s
          --timeout 5s
          --health-start-period 10s
          --retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install uv && uv sync && pip install -e .[dev]

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Check formatting with black
        run: uv run black --check .

      - name: Check imports with isort
        run: uv run isort --check-only --profile black .

      - name: Create database schema with Alembic
        run: uv run alembic upgrade head
        env:
          DATABASESETTINGS__PG_HOST: localhost
          DATABASESETTINGS__PG_PORT: 5432
          DATABASESETTINGS__PG_NAME: genew4_test
          DATABASESETTINGS__PG_USER: genew4_test
          DATABASESETTINGS__PG_PASSWORD: genew4_test_password

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=genew4_orm --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --cov=genew4_orm --cov-report=xml --cov-append --cov-report=term-missing
        env:
          DATABASESETTINGS__PG_HOST: localhost
          DATABASESETTINGS__PG_PORT: 5432
          DATABASESETTINGS__PG_NAME: genew4_test
          DATABASESETTINGS__PG_USER: genew4_test
          DATABASESETTINGS__PG_PASSWORD: genew4_test_password

      - name: Run e2e tests
        run: uv run pytest tests/e2e/ -v --cov=genew4_orm --cov-append --cov-report=xml

      - name: Generate coverage report
        run: uv run pytest --cov=genew4_orm --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
