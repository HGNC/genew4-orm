name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genew4
          POSTGRES_PASSWORD: genew4_test_password
          POSTGRES_DB: genew4
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 10s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Clean stale coverage data
        run: |
          # Remove any stale coverage files before running tests
          # This ensures accurate coverage reporting across CI runs
          rm -f .coverage* htmlcov/ coverage.xml

      - name: Initialize database schema
        env:
          DATABASESETTINGS_PG_HOST: localhost
          DATABASESETTINGS_PG_PORT: 5432
          DATABASESETTINGS_PG_NAME: genew4
          DATABASESETTINGS_PG_USER: genew4
          DATABASESETTINGS_PG_PASSWORD: genew4_test_password
        run: |
          export PYTHONPATH=src
          uv run python -c "
          import sys
          sys.path.insert(0, 'src')
          import genew4_orm.models  # noqa: F401 - Import models to register with SQLModel
          from genew4_orm.session import initialize_engine
          from sqlmodel import SQLModel
          from sqlalchemy import text
          engine = initialize_engine()

          # Create all SQLModel tables
          SQLModel.metadata.create_all(engine)

          # Manually create cytoband table (no PK, not a SQLModel)
          with engine.connect() as conn:
              conn.execute(text('''
                  CREATE TABLE IF NOT EXISTS cytoband (
                      cb_source VARCHAR(50),
                      cb_chr VARCHAR(50),
                      cb_start INTEGER,
                      cb_end INTEGER,
                      cb_band VARCHAR(50),
                      cb_stain VARCHAR(50)
                  )
              '''))
              conn.commit()

          print('Created tables:', sorted(t.name for t in SQLModel.metadata.tables.values()))
          print('Created cytoband table manually')
          "

      - name: Run tests with coverage
        env:
          DATABASESETTINGS_PG_HOST: localhost
          DATABASESETTINGS_PG_PORT: 5432
          DATABASESETTINGS_PG_NAME: genew4
          DATABASESETTINGS_PG_USER: genew4
          DATABASESETTINGS_PG_PASSWORD: genew4_test_password
          # Override for E2E tests
          DATABASESETTINGS__PG_HOST: localhost
          DATABASESETTINGS__PG_PORT: 5432
          DATABASESETTINGS__PG_NAME: genew4
          DATABASESETTINGS__PG_USER: genew4
          DATABASESETTINGS__PG_PASSWORD: genew4_test_password
        run: |
          uv run pytest --cov=genew4_orm --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            .coverage.*
            coverage.xml
          retention-days: 7

      - name: Check coverage threshold
        shell: bash
        run: |
          python3 - << 'EOF'
          import sys
          import xml.etree.ElementTree as ET
          import os

          cov_file = 'coverage.xml'
          if not os.path.exists(cov_file):
              print(f'::warning::Coverage file {cov_file} not found')
              sys.exit(1)

          try:
              tree = ET.parse(cov_file)
              root = tree.getroot()
              line_rate = float(root.get('line-rate', '0').replace('%', ''))
              print(f'Current coverage: {line_rate:.1f}%')
              if line_rate < 90:
                  print('::warning::Coverage is below 90% threshold')
                  sys.exit(1)
          except ET.ParseError as e:
              print(f'::warning::Could not parse coverage.xml: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'::warning::Exception reading coverage: {type(e).__name__}')
              sys.exit(1)
          EOF
